name: Watch TNSE jobs

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min, the fastest GitHub allows (runs can still lag at busy times)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      test_alert:
        description: "Send a test Discord alert instead of checking"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: tnse-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the page
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python watcher.py --test-alert
          else
            python watcher.py
          fi

      - name: Save state if it changed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "tnse-watcher-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update TNSE page snapshot"
            git push
          fi
